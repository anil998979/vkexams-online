<style>

/* =====================================================
   GLOBAL
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        linear-gradient(
            135deg,
            #f7f9ff,
            #fff8fc
        );
    color:#172033;
    min-height:100vh;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    text-decoration:none;
}


/* =====================================================
   HEADER
===================================================== */

header{
    position:sticky;
    top:0;
    z-index:1000;

    background:
        rgba(255,255,255,.96);

    backdrop-filter:blur(12px);

    border-bottom:
        1px solid #e5e7eb;

    box-shadow:
        0 3px 15px
        rgba(37,99,235,.08);
}

.navbar{
    max-width:1250px;
    margin:auto;

    padding:
        12px 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;
}

.logo{
    font-size:24px;
    font-weight:900;

    color:#2563eb;

    cursor:pointer;

    letter-spacing:.3px;
}

.logo span{
    color:#7c3aed;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:10px;
}

.nav-links a{
    color:#172033;

    font-weight:700;

    font-size:14px;

    padding:
        9px 12px;

    border-radius:8px;

    cursor:pointer;
}

.nav-links a:hover{
    background:#eef4ff;
    color:#2563eb;
}

.login-btn{
    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        ) !important;

    color:#fff !important;

    box-shadow:
        0 6px 15px
        rgba(37,99,235,.25);
}


/* =====================================================
   PAGE
===================================================== */

.page{
    display:none;

    min-height:
        calc(100vh - 70px);
}

.page.active{
    display:block;
}


/* =====================================================
   CONTAINER
===================================================== */

.container{
    max-width:1200px;

    margin:auto;

    padding:
        38px 20px;
}


/* =====================================================
   SECTION TITLE
===================================================== */

.section-title{
    text-align:center;

    margin:
        20px 0 28px;
}

.section-title h2{
    font-size:30px;

    background:
        linear-gradient(
            90deg,
            #2563eb,
            #7c3aed
        );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;
}

.section-title p{
    color:#6b7280;

    margin-top:8px;
}


/* =====================================================
   HERO
===================================================== */

.hero{
    position:relative;

    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #2563eb 0%,
            #4f46e5 48%,
            #9333ea 100%
        );

    color:#fff;

    padding:
        64px 20px;

    border-radius:
        0 0 28px 28px;

    box-shadow:
        0 15px 40px
        rgba(79,70,229,.22);
}

.hero:before,
.hero:after{
    content:"";

    position:absolute;

    border-radius:50%;

    background:
        rgba(255,255,255,.08);
}

.hero:before{
    width:260px;
    height:260px;

    right:-90px;
    top:-110px;
}

.hero:after{
    width:220px;
    height:220px;

    left:-110px;
    bottom:-150px;
}

.hero-content{
    max-width:1050px;

    margin:auto;

    text-align:center;

    position:relative;

    z-index:1;
}

.hero h1{
    font-size:46px;

    line-height:1.15;

    margin-bottom:16px;
}

.hero h1 span{
    color:#fde047;
}

.hero p{
    max-width:780px;

    margin:auto;

    line-height:1.7;

    font-size:17px;

    color:#eef2ff;
}

.hero-buttons{
    margin-top:26px;

    display:flex;

    justify-content:center;

    gap:12px;

    flex-wrap:wrap;
}

/* Highlight the two main actions on the home page */
.hero-buttons .btn{
    min-width:220px;
    min-height:58px;
    padding:17px 28px;
    border-radius:13px;
    font-size:18px;
    font-weight:900;
    letter-spacing:.2px;
    box-shadow:0 10px 24px rgba(15,23,42,.18);
    transition:transform .2s ease, box-shadow .2s ease;
}

.hero-buttons .btn:hover{
    transform:translateY(-4px) scale(1.025);
    box-shadow:0 16px 30px rgba(15,23,42,.24);
}

.hero-buttons .btn-primary{
    background:linear-gradient(135deg,#f59e0b,#f97316);
}

.hero-buttons .btn-light{
    background:#fff;
    color:#2457e8;
    border:2px solid rgba(255,255,255,.8);
}

@media(max-width:560px){
    .hero-buttons .btn{
        width:min(100%,320px);
        min-height:54px;
        font-size:17px;
    }
}


/* =====================================================
   BUTTONS
===================================================== */

.btn{
    border:0;

    border-radius:9px;

    padding:
        12px 20px;

    font-weight:800;

    transition:.2s;
}

.btn:hover{
    transform:
        translateY(-2px);
}

.btn-primary{
    background:
        linear-gradient(
            135deg,
            #f59e0b,
            #f97316
        );

    color:#fff;

    box-shadow:
        0 7px 18px
        rgba(249,115,22,.25);
}

.btn-blue{
    background:
        linear-gradient(
            135deg,
            #2563eb,
            #4f46e5
        );

    color:#fff;

    box-shadow:
        0 7px 18px
        rgba(37,99,235,.2);
}

.btn-light{
    background:#fff;

    color:#2563eb;

    border:
        1px solid #dbeafe;
}

.btn-danger{
    background:#dc2626;
    color:#fff;
}

.btn-outline{
    background:#fff;

    color:#2563eb;

    border:
        1px solid #2563eb;
}


/* Coming-soon labels used for courses that are not launched yet. */
.coming-soon-badge{
    display:inline-block;
    margin-top:9px;
    padding:5px 10px;
    border-radius:999px;
    background:#fff7ed;
    border:1px solid #fed7aa;
    color:#c2410c;
    font-size:11px;
    font-weight:900;
    letter-spacing:.2px;
}
.category-card.is-coming-soon{cursor:pointer;opacity:.88}

/* =====================================================
   CATEGORY CARDS
===================================================== */

.category-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:18px;
}

.category-card{
    position:relative;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            #fff,
            #fbfdff
        );

    border:
        1px solid #e5e7eb;

    border-radius:15px;

    padding:
        25px 18px;

    text-align:center;

    box-shadow:
        0 8px 22px
        rgba(37,99,235,.08);

    cursor:pointer;

    transition:.22s;
}

.category-card:before{
    content:"";

    position:absolute;

    left:0;
    right:0;
    top:0;

    height:4px;

    background:
        linear-gradient(
            90deg,
            #2563eb,
            #7c3aed
        );
}

.category-card:nth-child(2):before{
    background:
        linear-gradient(
            90deg,
            #f59e0b,
            #f97316
        );
}

.category-card:nth-child(3):before{
    background:
        linear-gradient(
            90deg,
            #7c3aed,
            #9333ea
        );
}

.category-card:nth-child(4):before{
    background:
        linear-gradient(
            90deg,
            #dc2626,
            #ef4444
        );
}

.category-card:nth-child(5):before{
    background:
        linear-gradient(
            90deg,
            #16a34a,
            #22c55e
        );
}

.category-card:nth-child(6):before{
    background:
        linear-gradient(
            90deg,
            #0891b2,
            #06b6d4
        );
}

.category-card:hover{
    transform:
        translateY(-5px);

    box-shadow:
        0 15px 30px
        rgba(37,99,235,.15);
}

.icon{
    font-size:42px;

    margin-bottom:12px;
}

.category-card h3{
    margin-bottom:8px;
}

.category-card p{
    font-size:13px;

    line-height:1.5;

    color:#6b7280;
}


/* =====================================================
   FEATURES
===================================================== */

.feature-grid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:16px;
}

.feature{
    position:relative;

    overflow:hidden;

    background:#fff;

    border:
        1px solid #e5e7eb;

    border-radius:12px;

    padding:20px;

    box-shadow:
        0 7px 18px
        rgba(37,99,235,.06);
}

.feature:before{
    content:"";

    position:absolute;

    left:0;
    right:0;
    top:0;

    height:4px;

    background:
        linear-gradient(
            90deg,
            #2563eb,
            #14b8a6
        );
}

.feature h3{
    font-size:16px;

    margin-bottom:8px;
}

.feature p{
    font-size:13px;

    color:#6b7280;

    line-height:1.5;
}


/* =====================================================
   BACK
===================================================== */

.back{
    display:inline-block;

    color:#2563eb;

    font-weight:800;

    margin-bottom:18px;

    cursor:pointer;
}


/* =====================================================
   EXAM HEADER
===================================================== */

.exam-header{
    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    color:#fff;

    padding:28px;

    border-radius:16px;

    margin-bottom:25px;

    box-shadow:
        0 12px 28px
        rgba(79,70,229,.18);
}

.exam-header h1{
    margin-bottom:8px;
}


/* =====================================================
   FREE MOCK TEST LIST - CARD LAYOUT
===================================================== */

#freeMocks.mock-list-mode{
    background:#f1f6f5;
    min-height:calc(100vh - 52px);
}

#freeMocks.mock-list-mode .container{
    max-width:1240px;
    padding-top:24px;
}

#freeMocks.mock-list-mode .exam-header{
    margin:0 0 18px;
    padding:0;
    background:transparent;
    color:#111827;
    box-shadow:none;
    border-radius:0;
}

#freeMocks.mock-list-mode .exam-header:before{
    content:"MOCK SERIES";
    display:block;
    margin-bottom:6px;
    color:#00877d;
    font-size:11px;
    font-weight:900;
    letter-spacing:1.1px;
}

#freeMocks.mock-list-mode .exam-header h1{
    margin:0;
    color:#101828;
    font-size:26px;
    font-weight:900;
}

#freeMocks.mock-list-mode .exam-header p{
    display:none;
}

.free-mock-search{
    display:flex;
    gap:10px;
    align-items:center;
    margin:18px 0 4px;
}
.free-mock-search input{
    width:100%;
    min-width:0;
    padding:13px 15px;
    border:1px solid #cbd5e1;
    border-radius:11px;
    background:#fff;
    color:#172033;
    outline:none;
    box-shadow:0 2px 8px rgba(30,64,175,.04);
}
.free-mock-search input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.10);
}
.free-mock-search button{
    flex:0 0 auto;
    border:1px solid #dbe3f0;
    border-radius:10px;
    padding:12px 15px;
    background:#fff;
    color:#334155;
    font-weight:800;
}
.free-mock-filter-empty{
    grid-column:1/-1;
    padding:24px;
    border:1px dashed #cbd5e1;
    border-radius:14px;
    background:#fff;
    color:#64748b;
    text-align:center;
}

.free-mock-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:16px;
    margin-top:22px;
}

.free-mock-card{
    position:relative;
    min-width:0;
    padding:18px 20px 16px;
    background:#fff;
    border:1px solid #dbe4ef;
    border-radius:17px;
    box-shadow:0 2px 4px rgba(15,23,42,.08),0 8px 18px rgba(15,23,42,.035);
    cursor:pointer;
    overflow:hidden;
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}

.free-mock-card:before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:4px;
    background:linear-gradient(90deg,#14b8a6,#10d6a2);
}

.free-mock-card:hover{
    transform:translateY(-3px);
    border-color:#99e6dc;
    box-shadow:0 10px 24px rgba(15,23,42,.10);
}

.free-mock-card-top{
    display:flex;
    align-items:center;
    gap:12px;
}

.free-mock-number{
    flex:0 0 42px;
    width:42px;
    height:42px;
    display:grid;
    place-items:center;
    border:1px solid #d7e6ee;
    border-radius:12px;
    background:#effcf9;
    color:#007f78;
    font-size:14px;
    font-weight:900;
}

.free-mock-heading{
    min-width:0;
    flex:1;
}

.free-mock-heading h3{
    margin:0 0 4px;
    color:#101828;
    font-size:18px;
    font-weight:850;
    line-height:1.25;
    display:block;
    max-height:2.5em;
    white-space:normal;
    overflow:hidden;
    text-overflow:clip;
    overflow-wrap:anywhere;
}

.free-mock-heading p{
    margin:0;
    color:#00877d;
    font-size:11px;
    font-weight:800;
    letter-spacing:.35px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.free-mock-badge{
    align-self:flex-start;
    padding:4px 11px;
    border:1px solid #d4ebe7;
    border-radius:20px;
    background:#effcf9;
    color:#008477;
    font-size:11px;
    font-weight:800;
}

.free-mock-stats{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:5px;
    margin-top:17px;
    padding:9px 7px;
    border:1px solid #dbe5f0;
    border-radius:12px;
    background:#f8fafc;
}

.free-mock-stat{
    text-align:center;
    color:#64748b;
    font-size:11px;
    white-space:nowrap;
}

.free-mock-stat strong{
    color:#111827;
    font-size:13px;
    margin-right:3px;
}

.free-mock-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid #e1e8f0;
}

.free-mock-info{
    color:#64748b;
    font-size:12px;
}

.free-mock-info span{
    color:#0d9488;
    margin-right:5px;
}

.free-mock-start{
    flex:0 0 auto;
    border:0;
    border-radius:11px;
    padding:9px 14px;
    background:#080f22;
    color:#fff;
    font-size:12px;
    font-weight:850;
    cursor:pointer;
}

.free-mock-start:hover{
    background:#1d4ed8;
}

.free-mock-empty{
    grid-column:1/-1;
    padding:28px;
    border:1px dashed #cbd5e1;
    border-radius:15px;
    background:#fff;
    color:#64748b;
    text-align:center;
}

@media(max-width:900px){
    .free-mock-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
}

@media(max-width:560px){
    .free-mock-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
    .free-mock-card{padding:13px 11px;}
    .free-mock-card-top{gap:7px;align-items:flex-start;}
    .free-mock-number{flex-basis:32px;width:32px;height:32px;font-size:12px;}
    .free-mock-heading h3{font-size:14px;line-height:1.25;}
    .free-mock-heading p{font-size:9px;}
    .free-mock-badge{padding:3px 7px;font-size:9px;}
    .free-mock-stats{gap:2px;padding:8px 3px;}
    .free-mock-stat{font-size:9px;white-space:normal;}
    .free-mock-stat strong{font-size:11px;display:block;margin:0 0 2px;}
    .free-mock-footer{align-items:stretch;flex-direction:column;gap:8px;}
    .free-mock-info{font-size:10px;}
    .free-mock-footer>div:last-child{width:100%;gap:5px!important;}
    .free-mock-footer button{flex:1;padding:9px 5px;font-size:10px;}
    .free-mock-search{gap:7px;}
    .free-mock-search button{padding:11px 10px;font-size:12px;}
}


/* =====================================================
   CHOICE CARDS
===================================================== */

.choice-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:18px;
}

.choice-card{
    position:relative;

    overflow:hidden;

    background:#fff;

    border:
        1px solid #e5e7eb;

    border-radius:15px;

    padding:
        30px 20px;

    text-align:center;

    cursor:pointer;

    box-shadow:
        0 7px 18px
        rgba(37,99,235,.07);

    transition:.2s;
}

.choice-card:before{
    content:"";

    position:absolute;

    top:0;
    left:0;
    right:0;

    height:4px;

    background:
        linear-gradient(
            90deg,
            #2563eb,
            #7c3aed
        );
}

.choice-card:hover{
    transform:
        translateY(-4px);

    border-color:#a5b4fc;

    box-shadow:
        0 14px 28px
        rgba(37,99,235,.12);
}

.big-icon{
    font-size:50px;

    margin-bottom:12px;
}

.choice-card h2{
    color:#2563eb;

    margin-bottom:8px;
}

.choice-card p{
    color:#6b7280;

    font-size:14px;
}


/* =====================================================
   SYLLABUS
===================================================== */

.syllabus-box{
    background:#fff;

    border:
        1px solid #e5e7eb;

    border-radius:15px;

    padding:25px;

    box-shadow:
        0 7px 20px
        rgba(37,99,235,.06);
}

.syllabus-list{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;

    margin-top:18px;
}

.syllabus-item{
    padding:14px;

    background:
        linear-gradient(
            90deg,
            #eff6ff,
            #faf5ff
        );

    border-left:
        5px solid #2563eb;

    border-radius:8px;
}


/* =====================================================
   PAPERS
===================================================== */

.paper-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:18px;
}

.paper-card{
    background:#fff;

    border:
        1px solid #e5e7eb;

    border-radius:15px;

    padding:25px;

    box-shadow:
        0 7px 20px
        rgba(37,99,235,.07);
}

.paper-card h2{
    color:#2563eb;

    margin-bottom:8px;
}

.paper-card p{
    color:#6b7280;

    margin-bottom:18px;
}

.test-list{
    display:flex;

    flex-direction:column;

    gap:9px;
}

.test-item{
    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:
        14px 16px;

    border:
        1px solid #e5e7eb;

    border-radius:9px;

    background:#fff;
}

.test-item.free{
    border-color:#16a34a;

    background:#f0fdf4;
}

.test-item.locked{
    cursor:pointer;
}

.test-item.locked:hover{
    background:#f8fafc;
}

.free-label{
    color:#15803d;

    font-weight:800;
}

.locked-label{
    color:#9ca3af;
}
   .test-item.unlocked{
    cursor:pointer;
    border-color:#16a34a;
    background:#f0fdf4;
}

.test-item.unlocked:hover{
    background:#ecfdf5;
}

.unlocked-label{
    color:#15803d;
    font-weight:800;
}
/* Paid CBT tests show a premium lock state until a valid package is active. */
.test-item.paid-locked{
    border:1.5px solid #d6a23a;
    background:linear-gradient(100deg,#fffaf0,#fff4d6);
    cursor:pointer;
}
.test-item.paid-locked:hover{
    background:linear-gradient(100deg,#fff4d6,#ffedbd);
    border-color:#b7791f;
}
.paid-locked-label{
    color:#9a5b08;
    font-weight:850;
}



/* =====================================================
   TOPIC TESTS
===================================================== */

.topic-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

/* =====================================================
   VK EXAMS - COLORFUL GLOBAL TOAST NOTIFICATIONS
===================================================== */
.toast{
    position:fixed !important;
    left:50% !important;
    right:auto !important;
    bottom:28px !important;
    top:auto !important;
    z-index:99999 !important;
    display:flex !important;
    align-items:center;
    gap:12px;
    width:max-content;
    max-width:min(92vw, 560px);
    min-width:min(280px, calc(100vw - 28px));
    box-sizing:border-box;
    padding:14px 16px;
    border:1px solid rgba(255,255,255,.28);
    border-radius:17px;
    color:#fff;
    background:linear-gradient(120deg,#2563eb 0%,#7c3aed 55%,#db2777 100%);
    box-shadow:0 16px 42px rgba(30,41,59,.28),0 4px 12px rgba(30,41,59,.14);
    font-size:14px;
    line-height:1.5;
    font-weight:700;
    text-align:left;
    white-space:pre-line;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transform:translate(-50%,18px) scale(.97);
    transition:opacity .24s ease,transform .24s ease,visibility .24s ease;
    overflow:hidden;
}
.toast:before{
    content:"";
    position:absolute;
    inset:0 auto 0 0;
    width:5px;
    background:rgba(255,255,255,.85);
}
.toast.show{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    transform:translate(-50%,0) scale(1);
}
.toast-icon{
    flex:0 0 38px;
    width:38px;
    height:38px;
    display:grid;
    place-items:center;
    border-radius:12px;
    background:rgba(255,255,255,.2);
    border:1px solid rgba(255,255,255,.25);
    font-size:21px;
}
.toast-message{
    flex:1;
    min-width:0;
    overflow-wrap:anywhere;
}
.toast-close{
    flex:0 0 28px;
    width:28px;
    height:28px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.18);
    color:#fff;
    font-size:19px;
    line-height:1;
    cursor:pointer;
}
.toast-close:hover{background:rgba(255,255,255,.3)}
.toast.toast-success{
    background:linear-gradient(120deg,#059669,#0f9f78 55%,#14b8a6);
}
.toast.toast-error{
    background:linear-gradient(120deg,#dc2626,#e11d48 55%,#f97316);
}
.toast.toast-info{
    background:linear-gradient(120deg,#2563eb,#6d28d9 55%,#9333ea);
}
@media(max-width:600px){
    .toast{
        bottom:18px !important;
        max-width:calc(100vw - 24px);
        min-width:0;
        width:calc(100vw - 24px);
        padding:12px 13px;
        border-radius:15px;
        font-size:13px;
    }
    .toast-icon{width:34px;height:34px;flex-basis:34px;font-size:19px}
}
@media(prefers-reduced-motion:reduce){
    .toast{transition:none}
}

}

.job-card-body{padding:0 12px 13px;display:flex;flex-direction:column;flex:1}

/* =====================================================
   EXAM HALL INTERFACE
===================================================== */
.exam-hall-page{padding:0!important;background:#eef3f8!important;min-height:100vh}
.exam-hall-page.active{display:block!important}
.exam-hall-shell{min-height:100vh;background:#eef3f8;color:#17243a;display:flex;flex-direction:column}
.exam-hall-topbar{height:76px;flex:0 0 76px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 24px;background:#fff;border-bottom:1px solid #dce5ef;box-shadow:0 2px 8px rgba(15,23,42,.05);position:sticky;top:0;z-index:50}
.exam-hall-titlebox{width:340px;max-width:25%;padding:8px 13px;border:1px solid #dce5ef;border-radius:15px;background:#f8fafc;overflow:hidden}
.exam-hall-course{font-size:11px;font-weight:750;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.exam-hall-titlebox strong{font-size:14px;color:#101828}
.exam-hall-progress{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 16px;border:1px solid #dce5ef;border-radius:30px;background:#fbfdff;font-size:11px;color:#475569;white-space:nowrap}
.exam-hall-progress b{color:#008577;font-size:13px}
.progress-dot{width:8px;height:8px;border-radius:50%;background:#10b981}
.progress-percent{padding:3px 7px;border-radius:5px;background:#e9fbf4;color:#008577;font-weight:800}
.progress-divider{height:19px;width:1px;background:#dce5ef}
.saved-indicator{color:#008577;font-weight:800}
.exam-hall-actions{display:flex;align-items:center;gap:7px}
.hall-tool,.hall-timer{height:42px;padding:0 12px;border:1px solid #dce5ef;border-radius:13px;background:#fff;color:#26364f;font-size:11px;font-weight:750;white-space:nowrap;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.hall-tool{cursor:pointer}
.hall-tool:hover{background:#f5f8fc}
.hall-timer{display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:82px;gap:1px}
.hall-timer small{font-size:8px;color:#64748b;letter-spacing:.8px}
.hall-timer strong{font-size:15px;letter-spacing:1.5px;color:#111827}
.hall-submit,.navigator-submit{border:0;border-radius:13px;background:#078477;color:white;font-size:12px;font-weight:850;padding:13px 18px;cursor:pointer}
.exam-hall-body{display:grid;grid-template-columns:minmax(0,1fr) 365px;flex:1;min-height:calc(100vh - 132px)}
.exam-hall-main{padding:22px clamp(18px,5vw,76px) 30px;min-width:0}
.exam-hall-notice{max-width:1100px;margin:0 auto 13px;padding:13px 16px;display:flex;align-items:center;gap:8px;background:#effbf9;border:1px solid #d2eeea;border-radius:13px;color:#0c3650;font-size:11px}
.exam-hall-notice>span:first-child{color:#078477;font-size:17px}
.exam-hall-notice button{margin-left:auto;border:0;border-radius:9px;background:#078477;color:#fff;padding:11px 14px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}
.notice-secondary{color:#58769a;white-space:nowrap}
.exam-question-panel{max-width:1100px;margin:0 auto;background:#fff;border:1px solid #dce5ef;border-radius:23px;padding:22px 24px 18px;box-shadow:0 2px 3px rgba(15,23,42,.08);position:relative}
.question-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.question-meta>div:first-child{display:flex;flex-direction:column;gap:3px}
.question-meta strong{font-size:10px;color:#00877d;letter-spacing:.6px}
.question-meta span{font-size:11px;color:#536b89}
.language-switch{display:flex;border:1px solid #dce5ef;border-radius:9px;overflow:hidden}
.language-switch button{border:0;padding:9px 12px;background:#f3f6fa;color:#34445c;font-size:11px;font-weight:750}
.language-switch button+button{background:#fff}
.exam-question-panel h2{font-size:19px;line-height:1.7;font-weight:650;color:#18253a;margin:10px 0 18px;white-space:pre-wrap}
.exam-answer-options{display:flex;flex-direction:column;gap:9px}
.exam-answer-options .option{display:flex;align-items:flex-start;gap:12px;padding:12px 13px;border:1px solid #dce5ef;border-radius:13px;background:#fff;cursor:pointer;transition:.15s}
.exam-answer-options .option:hover{border-color:#9edbd3;background:#f8fdfc}
.exam-answer-options .option:has(input:checked){border-color:#14b8a6;background:#effcf9;box-shadow:0 0 0 1px rgba(20,184,166,.1)}
.exam-answer-options .option input{position:absolute;opacity:0;pointer-events:none}
.exam-answer-options .option:before{content:attr(data-letter);width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;border-radius:8px;background:#f0f4f8;color:#40536d;font-size:13px;font-weight:850}
.exam-answer-options .option:has(input:checked):before{background:#078477;color:#fff}
.exam-answer-options .option-text{font-size:14px;line-height:1.65;color:#334b6c;padding-top:3px}
.question-utility-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding-top:15px;border-top:1px solid #e0e8f0}
.question-utility-actions{display:flex;gap:8px;flex-wrap:wrap}
.question-utility-actions button,.clear-answer{border:1px solid #dce5ef;border-radius:11px;background:#fff;color:#334b6c;padding:10px 13px;font-size:11px;font-weight:750;cursor:pointer}
.clear-answer{border:0;color:#6480a3;padding-left:0}
.question-utility-actions button:hover{background:#f5f8fc}
.question-utility-actions button.active-review{border-color:#f5d88b;background:#fff8e6;color:#946200}
.exam-question-navigator{background:#fff;border-left:1px solid #dce5ef;padding:17px 15px 16px;display:flex;flex-direction:column;min-width:0}
.navigator-heading{display:flex;justify-content:space-between;gap:8px;align-items:center;color:#526985;font-size:10px;letter-spacing:.8px}
.navigator-heading b{font-size:11px;letter-spacing:0;color:#334155}
.navigator-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:13px 0}
.navigator-stats>div{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;background:#f6f8fb;border-radius:12px}
.navigator-stats strong{font-size:16px;color:#008477}
.navigator-stats span{font-size:9px;color:#64748b}
.question-palette{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;align-content:start}
.question-palette button{height:43px;border:1px solid #dce5ef;border-radius:11px;background:#f0f4f8;color:#344b68;font-size:12px;font-weight:800;cursor:pointer}
.question-palette button.current{background:#101827;color:#fff;border-color:#101827;box-shadow:0 0 0 3px #baf3e8}
.question-palette button.answered{background:#d9f8ed;border-color:#b7ead8;color:#087b65}
.question-palette button.review{background:#fff1c9;border-color:#f5d98a;color:#936300}
.question-palette button.current.answered,.question-palette button.current.review{background:#101827;color:#fff}
.navigator-legend{margin-top:auto;padding:16px 0 13px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;border-top:1px solid #edf1f5;color:#60738d;font-size:10px}
.navigator-legend span{display:flex;align-items:center;gap:5px}
.navigator-legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.legend-answered{background:#baf3dc}.legend-review{background:#ffe8a3}.legend-empty{background:#e8edf3}
.navigator-submit{width:100%;border-radius:12px;padding:13px}
.exam-hall-footer{height:56px;flex:0 0 56px;display:flex;align-items:center;justify-content:space-between;padding:6px 24px;background:#fff;border-top:1px solid #dce5ef}
.exam-hall-footer button{border:1px solid #e0e8f0;border-radius:11px;background:#fff;color:#526985;padding:10px 14px;font-size:11px;font-weight:800;cursor:pointer}
.exam-hall-footer .footer-next{background:#101827;color:#fff;border-color:#101827;padding:11px 18px}
.exam-hall-footer .footer-hide-nav{margin-left:auto;margin-right:auto}
.footer-hide-nav span{margin-left:8px;padding:3px 6px;border-radius:5px;background:#e8fbf5;color:#078477;font-size:9px}
.exam-question-navigator.hidden{display:none}
.exam-hall-body.palette-hidden{grid-template-columns:minmax(0,1fr)}
.exam-hall-body.palette-hidden .exam-hall-main{padding-left:clamp(18px,8vw,130px);padding-right:clamp(18px,8vw,130px)}
.exam-hall-shell.paused .exam-question-panel:after{content:"TEST PAUSED";position:absolute;inset:0;display:grid;place-items:center;background:rgba(241,245,249,.88);border-radius:23px;color:#10213a;font-size:25px;font-weight:900;letter-spacing:2px;z-index:5}
@media(max-width:1150px){.exam-hall-topbar{height:auto;min-height:76px;flex-wrap:wrap}.exam-hall-titlebox{max-width:35%}.exam-hall-progress{order:3;width:100%;max-width:max-content;margin:0 auto}.exam-hall-body{grid-template-columns:minmax(0,1fr) 300px}.exam-hall-main{padding:18px}}

@media(max-width:440px){.hall-tool{font-size:9px;height:38px}.hall-timer{height:38px;min-width:65px}.hall-submit{padding:11px}.exam-hall-progress{font-size:9px;gap:7px;padding:8px}.question-meta{align-items:flex-start}.language-switch button{padding:7px;font-size:10px}.question-palette{grid-template-columns:repeat(5,minmax(0,1fr))}.exam-hall-notice{font-size:10px}.exam-hall-notice button{margin-left:0}}
